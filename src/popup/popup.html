<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simple Tab Manager</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="tray">
      <header class="header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7.5h10.5a2 2 0 0 1 2 2V18H6a2 2 0 0 1-2-2V7.5Z"/>
              <path d="M7 5h10.5a2 2 0 0 1 2 2v8.5"/>
              <path d="M8 11h5"/>
            </svg>
          </span>
          <span class="brand-name">Simple Tab Manager</span>
        </div>
        <button id="settings-button" class="theme-button" type="button" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="settings-panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.63 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.63a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.37 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.04Z"/>
          </svg>
          <span class="sr-only">Settings</span>
        </button>
        <button id="theme-button" class="theme-button" type="button" aria-label="Theme: System" title="Theme: System">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.64 5.64l1.42 1.42M16.94 16.94l1.42 1.42M18.36 5.64l-1.42 1.42M7.06 16.94l-1.42 1.42"/>
            <circle cx="12" cy="12" r="3.5"/>
          </svg>
          <span class="sr-only">Theme: System</span>
        </button>
      </header>

      <div id="settings-panel" class="settings-panel" hidden>
        <label class="settings-toggle">
          <input type="checkbox" id="keep-pins-toggle" checked>
          <span class="settings-toggle-text">
            <span class="settings-toggle-label">Keep pinned tabs pinned</span>
            <span class="settings-toggle-description">Off unpins tabs first so they can be sorted or moved like any other tab.</span>
          </span>
        </label>
        <label class="settings-toggle">
          <input type="checkbox" id="keep-groups-toggle" checked>
          <span class="settings-toggle-text">
            <span class="settings-toggle-label">Keep tab groups together</span>
            <span class="settings-toggle-description">Off dissolves your tab groups so tabs can be freely reorganized.</span>
          </span>
        </label>
      </div>

      <p class="tagline">Bring order to this window</p>

      <p class="privacy-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v5c0 4.6 2.8 8.2 7 10 4.2-1.8 7-5.4 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>Open-tab URLs are processed locally and never sent.</span>
      </p>

      <button class="primary-action" type="button" data-action="organize">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7.5h10.5a2 2 0 0 1 2 2V18H6a2 2 0 0 1-2-2V7.5Z"/>
          <path d="M7 5h10.5a2 2 0 0 1 2 2v8.5"/>
          <path d="m8 12 2 2 4-4"/>
        </svg>
        <span>Organize all tabs</span>
      </button>

      <div class="action-list" aria-label="Individual tab tools">
        <button class="action-row" type="button" data-action="consolidate">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h10a2 2 0 0 1 2 2v8H7a2 2 0 0 1-2-2V7Z"/><path d="M9 5h10v10"/><path d="M10 12h4"/></svg>
          <span>Bring tabs together</span><span class="row-chevron" aria-hidden="true">›</span>
        </button>
        <button class="action-row" type="button" data-action="sort">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6h12M6 12h8M6 18h4"/><path d="m16 15 3 3 3-3M19 18V6"/></svg>
          <span>Sort by domain</span><span class="row-chevron" aria-hidden="true">›</span>
        </button>
        <button class="action-row" type="button" data-action="deduplicate">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7.5h10.5a2 2 0 0 1 2 2V17H7a2 2 0 0 1-2-2V7.5Z"/><path d="M8 5h10.5a2 2 0 0 1 2 2v7"/><path d="m9 12 2 2 4-4"/></svg>
          <span>Remove duplicate URLs</span><span class="row-chevron" aria-hidden="true">›</span>
        </button>
      </div>

      <div id="status" class="status" role="status" aria-live="polite" aria-atomic="true">
        <span class="status-dot" aria-hidden="true"></span><span id="status-text">Ready</span>
      </div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
